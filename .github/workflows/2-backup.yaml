name: Automatizar Backup

on:
  schedule:
    - cron: '0 23 * * *'

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest 

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Executar backup
        run: python scripts/backup.py

      - name: Commit das alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add .
          git diff --staged --quiet || git commit -m "backup: backup mais recente realizado"
          git push || echo "nada para enviar"