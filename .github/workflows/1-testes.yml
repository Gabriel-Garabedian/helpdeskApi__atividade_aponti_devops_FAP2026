name: Pipeline 1 - Testes

on: [push, pull_request]

jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install flake8 pytest
      - run: pip install -r requirements.txt || true
      - run: flake8 .
      - run: pytest